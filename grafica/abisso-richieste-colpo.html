<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Richieste Abisso</title>
<style>
:root{--bg:#F3F6FA;--card:#FFFFFF;--line:#D5DEE8;--text:#0E1A26;--muted:#56677A;--acc:#1D6FA8;--code:#EEF3F8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07111C;--card:#0E1C2B;--line:#1F3348;--text:#E6EEF6;--muted:#8DA2B8;--acc:#5FB7EA;--code:#0A1724}}
:root[data-theme="dark"]{--bg:#07111C;--card:#0E1C2B;--line:#1F3348;--text:#E6EEF6;--muted:#8DA2B8;--acc:#5FB7EA;--code:#0A1724}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,sans-serif;padding:20px 16px 40px}
main{max-width:760px;margin:0 auto;display:grid;gap:16px}
h1{font-size:26px;margin:0}
p{margin:0;color:var(--muted)}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
h2{font-size:18px;margin:0;display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
h2 small{font-weight:600;color:var(--acc);font-size:14px}
pre{margin:0;background:var(--code);border-radius:10px;padding:12px;white-space:pre-wrap;word-break:break-word;font:13px/1.5 ui-monospace,Menlo,monospace;max-height:260px;overflow:auto}
button{justify-self:start;min-height:44px;padding:10px 18px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:600 15px system-ui,sans-serif;cursor:pointer}
button.ok{background:#2E9455}
</style>
</head>
<body>
<main>
  <h1>Abisso · richieste per il colpo</h1>
  <p>Ogni riquadro contiene già il blocco base più la richiesta: tocca «Copia» e incolla in ChatGPT, sempre nella stessa chat. Controlla su sfondo scuro che non ci sia il quadrettato finto.</p>
</main>
<script>
const BASE = 'Game asset for a mobile fantasy companion app, theme "Abisso" (deep ocean, blue water and arcane magic). Painterly-realistic fantasy style with rich detail; not cartoon, not a photo. Materials: clear deep-blue water, white foam, pearl, polished blue crystal, silver filigree, faint glowing arcane runes (no letters). Palette: deep navy, ocean blue, turquoise, foam white, silver. Soft light from the top-left with soft caustic reflections. Fully transparent background (real PNG alpha, no checkerboard), the whole subject visible with a small empty margin, not cropped. No text, no logos, no symbols, no cast shadow. Same style and lighting as the previous images.';
const ITEMS = [
  ['1. Onda che si infrange', 'il colpo · 2048×1024', 'A cresting ocean wave seen from slightly above, moving from left to right, curling foam at the right end, translucent blue water. 2048×1024.'],
  ['2. Foglio di 6 schizzi', 'sul campo colpito · 1536×1024', 'A sheet of 6 separate water splashes of different shapes, seen from directly above, translucent with white foam edges, on a 3×2 grid, not touching. 1536×1024.'],
  ['3. Foglio di 9 gocce', 'gocce che scivolano · 1024×1024', 'A sheet of 9 separate water droplets of different sizes, clear and glossy, on a 3×3 grid, not touching. 1024×1024.'],
  ['4. Anello d’onda', 'cerchi sull’acqua · 1024×1024', 'A single circular ripple ring on a water surface seen from directly above, thin and translucent, everything else transparent. 1024×1024.']
];
const main = document.querySelector('main');
ITEMS.forEach(([t, s, req]) => {
  const txt = BASE + '\n\n' + req;
  const sec = document.createElement('section');
  sec.innerHTML = '<h2></h2><pre></pre><button type="button">Copia</button>';
  sec.querySelector('h2').innerHTML = '<span></span><small></small>';
  sec.querySelector('h2 span').textContent = t;
  sec.querySelector('h2 small').textContent = s;
  sec.querySelector('pre').textContent = txt;
  const b = sec.querySelector('button');
  b.onclick = async () => {
    try { await navigator.clipboard.writeText(txt) }
    catch(e){ const r = document.createRange(); r.selectNodeContents(sec.querySelector('pre')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); document.execCommand('copy') }
    b.textContent = 'Copiato'; b.classList.add('ok'); setTimeout(() => { b.textContent = 'Copia'; b.classList.remove('ok') }, 1600);
  };
  main.appendChild(sec);
});
</script>
</body>
</html>
